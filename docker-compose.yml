services:
  cobryx-api:
    image: ${DOCKER_REGISTRY-}cobryxapi
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 5000:80
      # Health checks available at http://localhost:5000/health
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__DefaultConnection=${COBRYX_CONNECTION_STRING:-Host=aws-0-us-west-2.pooler.supabase.com;Database=postgres;Username=postgres.wofxgtfarmbqhoqwqaqd;Password=YOUR_PASSWORD;SSL Mode=Require;Keepalive=30}
      - JwtSettings__Secret=${COBRYX_JWT_SECRET:-YOUR_JWT_SECRET_MIN_32_CHARS}
      - Storage__AzureBlob__ConnectionString=${COBRYX_STORAGE_CONNECTION_STRING:-UseDevelopmentStorage=true}
      - Security__ClamAV__Host=clamav
      - Caching__Redis__ConnectionString=redis:6379
      - DOTNET_SYSTEM_NET_DISABLEIPV6=true
      # OAuth
      - OAuth__Google__ClientId=${COBRYX_OAUTH_GOOGLE_CLIENTID}
      # Email
      - Email__SmtpHost=${COBRYX_EMAIL_SMTP_HOST:-localhost}
      - Email__SmtpPort=${COBRYX_EMAIL_SMTP_PORT:-25}
      - Email__SmtpUsername=${COBRYX_EMAIL_SMTP_USERNAME}
      - Email__SmtpPassword=${COBRYX_EMAIL_SMTP_PASSWORD}
      - Email__FromAddress=${COBRYX_EMAIL_FROM_ADDRESS:-[EMAIL_ADDRESS]}
    depends_on:
      - clamav
      - redis
    restart: always

  clamav:
    image: clamav/clamav:latest
    container_name: cobryx-clamav
    platform: linux/amd64
    restart: always

  redis:
    image: redis:7-alpine
    container_name: cobryx-redis
    ports:
      - 6379:6379
    restart: always
