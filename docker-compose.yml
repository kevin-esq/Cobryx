services:
  cobryx-api:
    image: ${DOCKER_REGISTRY-}cobryxapi
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 5000:8080
      # Health checks available at http://localhost:5000/health
    env_file:
      - .env
    environment:
      - DOTNET_SYSTEM_NET_DISABLEIPV6=true
      - Security__ClamAV__Host=clamav
    depends_on:
      - clamav
      - redis
    restart: always

  clamav:
    image: clamav/clamav:latest
    container_name: cobryx-clamav
    platform: linux/amd64
    restart: always

  redis:
    image: redis:7-alpine
    container_name: cobryx-redis
    ports:
      - 6379:6379
    restart: always
