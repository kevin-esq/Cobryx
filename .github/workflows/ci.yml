name: CI + Determinism Guard

on:
    pull_request:
    push:
        branches: [develop, main]

permissions: read-all

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x

            - name: Restore
              run: dotnet restore

            - name: Build
              run: dotnet build --configuration Release --no-restore

            - name: Unit & Domain Tests
              run: |
                dotnet test Cobryx.Domain.Tests/Cobryx.Domain.Tests.csproj --configuration Release --no-build
                dotnet test Cobryx.Application.Tests/Cobryx.Application.Tests.csproj --configuration Release --no-build

            - name: Architecture Tests
              run: dotnet test Cobryx.Architecture.Tests/Cobryx.Architecture.Tests.csproj --configuration Release --no-build

            # Runs the whole Cobryx.Integration.Tests project. The csproj boundary
            # already encodes intent ("every test in this project is an integration
            # test"), so we do not layer a trait filter on top — that previously
            # caused ~65 of 76 tests to be silently skipped because only one file
            # carried [Trait("Category", "Integration")].
            - name: Integration Tests
              run: dotnet test Cobryx.Integration.Tests/Cobryx.Integration.Tests.csproj --configuration Release --no-build

    determinism-check:
        runs-on: ubuntu-latest
        needs: build-and-test
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x

            - name: Build
              run: dotnet build --configuration Release

            - name: Run Replay Engine Tests
              run: dotnet test --configuration Release --filter "ReplayEngineTests"

            - name: Enforce Determinism
              run: echo "Deterministic replay validated ✅"
