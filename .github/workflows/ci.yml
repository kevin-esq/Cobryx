name: CI + Determinism Guard

on:
    pull_request:
    push:
        branches: [develop, main]

permissions: read-all

jobs:
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x

            - name: Restore
              run: dotnet restore

            - name: Build
              run: dotnet build --configuration Release --no-restore

            - name: Unit Tests
              run: dotnet test --no-build --filter "Category!=Integration&Category!=Replay"

            - name: Integration Tests
              run: dotnet test --no-build --filter "Category=Integration"

    determinism-check:
        runs-on: ubuntu-latest
        needs: build-and-test
        steps:
            - name: Checkout repo
              uses: actions/checkout@v4

            - name: Setup .NET
              uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: 8.0.x

            - name: Build
              run: dotnet build --configuration Release

            - name: Run Replay Engine Tests
              run: dotnet test --filter "ReplayEngineTests"

            - name: Enforce Determinism
              run: echo "Deterministic replay validated ✅"
